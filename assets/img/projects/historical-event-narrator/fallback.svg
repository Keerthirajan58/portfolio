<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Historical Event Narrator fallback cover</title>
  <desc id="desc">A red and black visual of a timeline, archive cards, and an AI narrative engine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12090a"/>
      <stop offset="1" stop-color="#1a1d22"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <circle cx="960" cy="130" r="260" fill="#ff0000" opacity=".12"/>
  <path d="M115 554 C315 384 405 464 590 306 C762 158 910 212 1085 110" fill="none" stroke="#ff0000" stroke-width="8"/>
  <g fill="none" stroke="#ff4d4d" stroke-width="2" opacity=".8">
    <rect x="135" y="145" width="260" height="165" rx="18"/>
    <rect x="470" y="260" width="300" height="190" rx="18"/>
    <rect x="825" y="430" width="245" height="150" rx="18"/>
