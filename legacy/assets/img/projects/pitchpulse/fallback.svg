<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">PitchPulse fallback cover</title>
  <desc id="desc">A red and dark sports science dashboard visual for football player readiness and injury risk.</desc>
  <rect width="1200" height="750" fill="#0e1013"/>
  <rect x="80" y="90" width="1040" height="570" rx="30" fill="#171b21" stroke="#2b313b" stroke-width="3"/>
  <circle cx="330" cy="350" r="170" fill="none" stroke="#ff0000" stroke-width="8"/>
  <path d="M330 350 L330 185 M330 350 L470 420 M330 350 L205 455 M330 350 L440 245" stroke="#ff4d4d" stroke-width="5"/>
  <circle cx="330" cy="350" r="18" fill="#ff0000"/>
  <rect x="620" y="165" width="390" height="58" rx="12" fill="#222832"/>
  <rect x="620" y="260" width="300" height="58" rx="12" fill="#222832"/>
  <rect x="620" y="355" width="355" height="58" rx="12" fill="#222832"/>
  <rect x="620" y="450" width="260" height="58" rx="12" fill="#222832"/>
  <g fill="#ffffff" font-family="Arial, Helvetica, sans-serif">
    <text x="640" y="202" font-size="24" font-weight="700">Readiness 84%</text>
    <text x="640" y="297" font-size="24" font-weight="700">ACWR Risk: Medium</text>
    <text x="640" y="392" font-size="24" font-weight="700">rPPG Vitals</text>
    <text x="640" y="487" font-size="24" font-weight="700">Suggested XI</text>
  </g>
  <text x="80" y="710" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800">PitchPulse</text>
</svg>
